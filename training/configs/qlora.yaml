schema_version: "1.0"
quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quantization: true
  compute_dtype: bfloat16
  device_map: cuda:0
  trust_remote_code: false
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: "none"
  task_type: CAUSAL_LM
  target_regex: 'language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)$'
  first_experiment: attention-only
memory:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  max_sequence_length: 10240
  manual_gradient_checkpointing: true
  int8_embedding_table: true
  chunked_loss_tokens: 256
  optim: paged_adamw_8bit
  max_grad_norm: 1.0
  min_free_vram_gb: 2
measured_on: 2026-11-02
evidence: training/smoke_qlora.json
note: >-
  The 10240 window is measured on the only supported card. A fresh hardware
  profile starts at 4096 and must climb this ladder only after its own preflight
  keeps at least 2 GB free. 12288 paginates and is not a training target.
