schema_version: "1.0"
learning_rate: 0.0001
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_length: 10240
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
gradient_checkpointing: manual
logging_steps: 10
save_steps: 250
save_total_limit: 3
optim: paged_adamw_8bit
note: >-
  Values are the measured starting point, not a claim of optimality. The first
  run uses the manual per-layer checkpointing and chunked loss from qlora.yaml.
