  revision: 7b3c7d619fa3c2f5d24a33bce5b413dcc48b2680
  name: Gemma 4 SWE-agent SFT trajectories (harness-week-3)
  license: mixed
  license_detail: >-
    Dataset metadata is CC-BY-4.0. Source code quoted in tool outputs stays under
    each repository's permissive license, recorded per row in
    license.repository_license. Assistant turns were generated with Anthropic
    Claude and remain subject to Anthropic's terms.
  config: sft
  train: data/sft_train.jsonl
  validation: data/sft_val.jsonl
  format: harness-native
  tools:
    - run_command
    - read_file
    - edit_file
    - write_file
    - submit_patch
    - get_status
  filters:
    verification_status: VERIFIED
    is_successful_demonstration: true
    repository_license_allowlist:
      - MIT License
      - Apache License 2.0
      - BSD 3-Clause "New" or "Revised" License
      - BSD License
      - BSD 2-Clause "Simplified" License
      - BSD
      - Zope Public License 2.1
      - BSD 3-Clause
      - BSD-3-Clause
      - ISC License
      - BSD 2-clause license
      - Creative Commons Zero v1.0 Universal
      - Apache License 2.0 or MIT License
      - New BSD License
      - The Unlicense
      - MIT/X Consortium license
      - MIT/Apache-2.0 Dual License
      - Apache 2.0 or BSD3
      - BSD 3-Clause License
  system_prompt: submission/prompts/system.md
  replacements:
    - The dataset system message is replaced with the shipped prompt.
    - Tool arguments are null-stripped and validated against the harness set.
    - Multiple tool calls in one assistant turn are preserved and paired by tool_call_id.
optional_buckets:
  recovery:
    train: data/recovery_train.jsonl
    validation: data/recovery_val.jsonl
    use: later, for the recovery phase
  partial:
    train: data/partial.jsonl
    use: excluded from SFT; incomplete trajectories
superseded:
  - id: nvidia/Open-SWE-Traces
    reason: >-
      Four foreign tools and a foreign system prompt; superseded by the
      harness-native dataset that already uses the swegemma tool names.
deferred:
  - id: nvidia/SWE-Hero-openhands-trajectories
    reason: no language column and no resolved column
  - id: nvidia/SWE-Zero-openhands-trajectories
    reason: no language column, no resolved column, execution-free
leakage:
  exclude_repos:
    - fastapi/fastapi
    - Textualize/rich
    - psf/requests
    - encode/httpx
disk_policy:
  full_download: forbidden
  read_mode: streamed-jsonl
  local_bytes: 0
  reason: >-
    The sft config is about 114 MB of JSONL. The audit streams it line by line
    and persists nothing; the adapter ships, the corpus does not.
