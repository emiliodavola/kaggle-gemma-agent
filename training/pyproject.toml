[project]
name = "e4b-training"
version = "0.1.0"
description = "LoRA SFT of gemma-4-e4b-it on one RTX 3090; see docs/proposals/20261101-lora-sft.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "peft>=0.21.2",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "transformers>=5.22.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
