# Optional participant evaluation configuration for Stage 1 inference.
# Per-task budgets for the swegemma harness.
# `timeout_seconds` caps one command; the 60-minute task budget is separate.
# 300 seconds matches the local swegemma CLI default.
evaluation:
  timeout_seconds: 300
  max_tool_calls: 100
  max_time_minutes: 60
  max_turns: 500
