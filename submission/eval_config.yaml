# Optional participant evaluation configuration for Stage 1 inference.
# Per-task budgets for the swegemma harness.
# Traceability: AGENTS.md "Harness budgets" (60 min / 100 tool calls),
# docs/skill-stack-inventory.md section A (500 turns), and the ratio in
# data/raw/sample_submission/eval_config.yaml (timeout_seconds = max_time_minutes * 60).
evaluation:
  timeout_seconds: 3600
  max_tool_calls: 100
  max_time_minutes: 60
  max_turns: 500
