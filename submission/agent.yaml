# Declarative agent manifest for the swegemma harness.
# Schema mirrors the official sample at data/raw/sample_submission/agent.yaml.
# Declarative only: no agent.py, no dynamic imports, closed registries.
# The skills/ directory is auto-loaded as read-only context (see docs/skill-stack-inventory.md section A).
# Per-task budgets (declared in eval_config.yaml, enforced by the harness):
#   100 tool calls, 60 minutes wall-clock, 500 turns.
#   `submit_patch` and `get_status` are free and consume no tool calls.
name: kaggle_gemma_agent
model: gemma-4-e4b-it-qat-w4a16-ct
# Rank-32 LoRA trained on the harness-native SFT corpus. The binary is a build
# artifact uploaded with the Kaggle code dataset; it is not committed to git.
adapter: main_lora
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
