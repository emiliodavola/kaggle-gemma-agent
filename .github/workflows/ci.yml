name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src/ tests/
      - run: uv run coverage run -m pytest tests/ -q
      - run: uv run coverage report -m
      - run: uv run python -m kaggle_gemma_agent.pack submission --check
