name: Task / bug report
description: Structured issue for a bug, regression, enhancement, chore, or documentation change.
title: "[area]: "
body:
  - type: markdown
    attributes:
      value: |
        Complete every required field. Precise context and **real command output** get issues resolved faster.
        Keep the sections even if short; delete placeholder lines that do not apply.

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: What kind of work is this?
      options:
        - Bug
        - Regression
        - Enhancement
        - Chore
        - Documentation
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area / component
      description: The file, phase, or subsystem this touches.
      placeholder: "e.g. scripts/host-trial/run_host_trial.py (phase 3b/8), src/kaggle_gemma_agent/pack.py"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences a reviewer can grasp without opening the code.
      placeholder: The host-trial runner aborts on an offline host even when the local wheel set is complete.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / current behavior
      description: What happens today, and why it matters. State the observed behavior and its impact.
      placeholder: |
        Describe the current behavior, when it happens, and who/what it blocks.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead. State the observable contract.
      placeholder: |
        Describe the behavior after the fix, as a reviewer would verify it.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction / evidence
      description: |
        Exact steps, commands, commit/PR references, and real output.
        Paste real command output — do not summarize or claim.
      render: shell
      placeholder: |
        $ uv run pytest tests/ -q
        ...

        Found while reviewing commit <sha> (PR #N).
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that close this issue.
      value: |
        - [ ] Behavior changed as described
        - [ ] Focused test added (failing before the fix, passing after)
        - [ ] `uv run pytest tests/ -q` green
        - [ ] `uv run ruff check src/ tests/ scripts/` clean
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In scope and explicitly out of scope. Non-goals prevent scope creep.
      value: |
        **In scope**
        - ...

        **Out of scope**
        - ...
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Repo rules that bound the work. Keep what applies and delete the rest.
      value: |
        - uv only (`uv sync` / `uv add` / `uv run`); never pip, pixi, or poetry
        - shipped artifacts stay offline: no network, pip, MCP, or subprocess strings under `submission/`
        - per-task harness budget: 100 tool calls / 60 minutes
        - no direct commits to `main`; feature branch + PR against the integration branch
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, commits, docs, or runbook sections.
      placeholder: |
        - Commit 043f921
        - PR #24
        - docs/host-trial-runbook.md sec. 4
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and PRs; this is not a duplicate.
          required: true
        - label: The evidence above is real command output, not a claim.
          required: true
        - label: I did not include secrets, tokens, or `.env` contents.
          required: true
